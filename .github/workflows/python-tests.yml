name: Python Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --dev
          pipenv run pip install -e .

      - name: Run tests
        env:
          EMAIL: ${{ secrets.EPIC_EMAIL }}
          PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          EPIC_DOMAIN: ${{ secrets.EPIC_DOMAIN }}
        run: pipenv run pytest tests/
